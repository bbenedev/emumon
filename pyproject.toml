[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emumon"
version = "1.1.0"
description = "Command line monitor for the memory and CPU of Android emulator processes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bautista Benestante" }]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
emumon = "emumon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
